# .github/workflows/build.yml
name: Build Windows EXE

on:
  # Publishing a release on GitHub builds the .exe and attaches it, so anyone
  # can download and run it without installing Python.
  release:
    types: [published]
  # Or build on demand from the Actions tab, without cutting a release.
  workflow_dispatch:

# GITHUB_TOKEN is read-only by default, so attaching files to a release fails
# with "Resource not accessible by integration" without this.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Stamp the version from the release tag
        # So `--version` and the window title match the release people
        # downloaded, instead of whatever was last hard-coded.
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          Write-Host "Stamping version $version"
          $file = "src/dndmusic/config.py"
          (Get-Content $file) -replace '^APP_VERSION = ".*"', "APP_VERSION = ""$version""" |
            Set-Content $file
          Select-String -Path $file -Pattern 'APP_VERSION'

      - name: Fetch FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null

          # BtbN's builds are the usual source for Windows FFmpeg binaries and
          # the "latest" tag is a stable pointer, so this URL does not rot.
          # (The xiph/opus releases have no Windows DLL at all — that download
          # 404'd silently for every build before this.)
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in the archive" }
          Copy-Item $exe.FullName vendor/ffmpeg.exe

      - name: Locate libopus (shipped inside disnake)
        shell: pwsh
        run: |
          # disnake bundles libopus in its own package, so there is nothing to
          # download.  Copying it into vendor/ puts it beside the .exe at
          # runtime, where audio/opus.py already looks for it.
          $dll = python -c "import disnake, pathlib; print(pathlib.Path(disnake.__file__).parent / 'bin' / 'libopus-0.x64.dll')"
          Write-Host "disnake ships: $dll"
          if (-not (Test-Path $dll)) { throw "libopus-0.x64.dll not found inside disnake" }
          Copy-Item $dll vendor/libopus-0.dll

      - name: Confirm both native dependencies are present
        shell: pwsh
        run: |
          Get-ChildItem vendor | Format-Table Name, Length
          # An .exe without these cannot decode audio or join voice.  Failing
          # here beats shipping one that looks fine and isn't.
          if (-not (Test-Path vendor/ffmpeg.exe)) { throw "vendor/ffmpeg.exe missing" }
          if (-not (Test-Path vendor/libopus-0.dll)) { throw "vendor/libopus-0.dll missing" }

      - name: Verify the build includes its native and lazy dependencies
        shell: pwsh
        run: |
          python -c "import nacl.secret; print('PyNaCl importable:', True)"

          # Out-String matters: `python build.py --dry-run` returns an ARRAY of
          # lines, and in PowerShell `array -notmatch x` filters rather than
          # returning a boolean — it yields every non-matching line, which is
          # truthy, so the check fired on every build.  Flatten it to one string
          # and use -match, which is a boolean on a scalar.
          $output = (python build.py --dry-run | Out-String)
          Write-Host $output

          foreach ($flag in @('--collect-all nacl', '--collect-all disnake')) {
            if (-not ($output -match [regex]::Escape($flag))) {
              throw "build.py is missing $flag"
            }
            Write-Host "ok: $flag"
          }

      - name: Build
        # Same script you run locally, so a CI build and a desk build cannot drift.
        run: python build.py

      - name: Smoke test the executable
        run: |
          dist/DnDMusicManager.exe --version
          dist/DnDMusicManager.exe --help

      - name: Package for download
        shell: pwsh
        run: |
          $stage = "package/DnDMusicManager"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/DnDMusicManager.exe $stage/
          Copy-Item README.md $stage/
          Copy-Item .env.example $stage/
          Copy-Item docs/PLAYER-GUIDE.md $stage/ -ErrorAction SilentlyContinue
          Copy-Item docs/LOUDNESS.md $stage/ -ErrorAction SilentlyContinue
          @"
          D&D Music Manager
          =================

          1. Run DnDMusicManager.exe.
          2. It will ask for a Discord bot token on first run.
             Only needed for the bot; to use it as a plain music player,
             choose Output = "This PC" and ignore the prompt.
          3. Music, playlists and settings are stored next to the .exe.

          Read PLAYER-GUIDE.md for adding music, volume, and what to do if
          something is missing.

          FFmpeg and Opus are bundled — nothing else to install.
          "@ | Set-Content $stage/START-HERE.txt
          Compress-Archive -Path $stage -DestinationPath DnDMusicManager-windows.zip -Force
          Get-ChildItem DnDMusicManager-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DnDMusicManager-windows
          path: |
            dist/DnDMusicManager.exe
            DnDMusicManager-windows.zip
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            dist/DnDMusicManager.exe `
            DnDMusicManager-windows.zip `
            --clobber