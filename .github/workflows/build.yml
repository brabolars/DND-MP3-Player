# .github/workflows/build.yml
name: Build Windows EXE

on:
  # Publishing a release on GitHub builds the .exe and attaches it, so anyone
  # can download and run it without installing Python.
  release:
    types: [published]
  # Or build on demand from the Actions tab, without cutting a release.
  workflow_dispatch:

# GITHUB_TOKEN is read-only by default, so attaching files to a release fails
# with "Resource not accessible by integration" without this.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Stamp the version from the release tag
        # So `--version` and the window title match the release people
        # downloaded, instead of whatever was last hard-coded.
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          Write-Host "Stamping version $version"
          $file = "src/dndmusic/config.py"
          (Get-Content $file) -replace '^APP_VERSION = ".*"', "APP_VERSION = ""$version""" |
            Set-Content $file
          Select-String -Path $file -Pattern 'APP_VERSION'

      - name: Fetch native dependencies (opus + ffmpeg)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null

          # libopus — required for voice output
          Invoke-WebRequest -Uri "https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2-win-x64.zip" -OutFile opus.zip
          Expand-Archive opus.zip -DestinationPath opus_tmp -Force
          $dll = Get-ChildItem -Recurse opus_tmp -Filter "*opus*.dll" | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName vendor/libopus-0.dll }

          # ffmpeg — required for decoding, mixing and loudness measurement
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter "ffmpeg.exe" | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName vendor/ffmpeg.exe }

          Get-ChildItem vendor

      - name: Build
        # Same script you run locally, so a CI build and a desk build cannot drift.
        run: python build.py

      - name: Smoke test the executable
        run: |
          dist/DnDMusicManager.exe --version
          dist/DnDMusicManager.exe --help

      - name: Package for download
        shell: pwsh
        run: |
          $stage = "package/DnDMusicManager"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/DnDMusicManager.exe $stage/
          Copy-Item README.md $stage/
          Copy-Item .env.example $stage/
          Copy-Item docs/LOUDNESS.md $stage/ -ErrorAction SilentlyContinue
          @"
          D&D Music Manager
          =================

          1. Run DnDMusicManager.exe.
          2. It will ask for a Discord bot token on first run.
             Only needed for the bot; to use it as a plain music player,
             choose Output = "This PC" and ignore the prompt.
          3. Music, playlists and settings are stored next to the .exe.

          FFmpeg and Opus are bundled — nothing else to install.
          "@ | Set-Content $stage/START-HERE.txt
          Compress-Archive -Path $stage -DestinationPath DnDMusicManager-windows.zip -Force
          Get-ChildItem DnDMusicManager-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DnDMusicManager-windows
          path: |
            dist/DnDMusicManager.exe
            DnDMusicManager-windows.zip
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            dist/DnDMusicManager.exe `
            DnDMusicManager-windows.zip `
            --clobber