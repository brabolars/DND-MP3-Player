# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # PyQt6 needs a platform plugin; there is no display on a runner.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        # PyQt6 wheels link against these, and ffmpeg lets the audio tests run
        # for real instead of skipping.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install Python dependencies
        # Deliberately not the whole of requirements.txt: disnake is not needed
        # to test, and the code already degrades gracefully without it, so this
        # keeps CI fast and independent of the Discord stack.
        run: |
          python -m pip install --upgrade pip
          pip install numpy PyQt6 certifi pytest ruff

      - name: Lint
        run: ruff check src tests
        continue-on-error: true

      - name: Run tests
        run: pytest -q
