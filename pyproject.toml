# pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-music-manager"
version = "3.0.0"
description = "Discord music bot for tabletop sessions, with a PyQt6 control surface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "disnake[voice]>=2.9",
    "PyQt6>=6.6",
    "numpy>=1.26",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.6", "ruff>=0.4"]

[project.scripts]
dnd-music-manager = "dndmusic.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
